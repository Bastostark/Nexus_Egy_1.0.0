<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #020712;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(41, 121, 255, 0.2);
      border-top-color: #2979ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: 14px;
      color: #82b1ff;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="game-loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-msg">Iniciando motor de jogo...</div>
  </div>
  <div id="game-container"></div>

  <script>
    window.addEventListener('message', async (event) => {
      const msg = event.data;
      if (!msg) return;

      if (msg.type === 'START_GAME') {
        const { core, title, gameUrl } = msg;
        const loadingMsg = document.getElementById('loading-msg');
        if (loadingMsg) loadingMsg.textContent = `Carregando ${title || 'Jogo'}...`;

        window.EJS_player = '#game-container';
        window.EJS_core = core;
        window.EJS_gameName = title;
        window.EJS_gameUrl = gameUrl;
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_startOnLoaded = true;
        window.EJS_defaultControls = true;
        window.EJS_color = '#2979ff';

        window.EJS_onGameStart = () => {
          const l = document.getElementById('game-loading');
          if (l) {
            l.style.opacity = '0';
            setTimeout(() => { l.style.display = 'none'; }, 400);
          }
        };

        const script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        script.onerror = () => {
          if (loadingMsg) loadingMsg.textContent = 'Erro ao conectar aos servidores de emulação. Verifique sua conexão com a internet.';
        };
        document.body.appendChild(script);
      }
    });

    // Notifica que o player carregou
    window.parent.postMessage({ type: 'NEXUS_PLAYER_READY' }, '*');
  </script>
</body>
</html>
