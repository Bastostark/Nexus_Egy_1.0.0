name: Build Nexus Egy
on: [workflow_dispatch, push]

jobs:
  # ==========================================
  # JOB 1: GERAR APK ANDROID
  # ==========================================
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Identificar diretório do projeto
        id: set-dir
        run: |
          if [ -f "package.json" ]; then
            echo "workdir=." >> $GITHUB_OUTPUT
          elif [ -f "nexus-egy/package.json" ]; then
            echo "workdir=nexus-egy" >> $GITHUB_OUTPUT
          else
            echo "workdir=." >> $GITHUB_OUTPUT
          fi

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Dependências
        working-directory: ${{ steps.set-dir.outputs.workdir }}
        run: npm install

      - name: Adicionar e Sincronizar Android (Capacitor)
        working-directory: ${{ steps.set-dir.outputs.workdir }}
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Compilar APK (Gradle)
        working-directory: ${{ steps.set-dir.outputs.workdir }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: NexusEgy-Android-APK
          path: ${{ steps.set-dir.outputs.workdir }}/android/app/build/outputs/apk/debug/*.apk

  # ==========================================
  # JOB 2: GERAR INSTALADOR WINDOWS (.EXE)
  # ==========================================
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Identificar diretório do projeto
        id: set-dir
        shell: pwsh
        run: |
          if (Test-Path "package.json") {
            "workdir=." >> $env:GITHUB_OUTPUT
          } elseif (Test-Path "nexus-egy/package.json") {
            "workdir=nexus-egy" >> $env:GITHUB_OUTPUT
          } else {
            "workdir=." >> $env:GITHUB_OUTPUT
          }

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências
        working-directory: ${{ steps.set-dir.outputs.workdir }}
        run: npm install

      - name: Gerar Instalador Windows (.exe)
        working-directory: ${{ steps.set-dir.outputs.workdir }}
        run: npm run dist:win

      - name: Disponibilizar Instalador Windows para Download
        uses: actions/upload-artifact@v4
        with:
          name: NexusEgy-Windows-Installer
          path: ${{ steps.set-dir.outputs.workdir }}/dist/*.exe
