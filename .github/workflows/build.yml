name: Build Nexus Egy
on: [workflow_dispatch, push]

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: GERAR APK ANDROID
  # ==========================================
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar Licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Preparar e Compilar APK Android
        run: |
          INDEX_FILE=$(find . -name "index.html" | head -n 1)
          APP_DIR=$(dirname "$INDEX_FILE")
          cd "$APP_DIR"

          mkdir -p www
          cp -rf index.html manifest.json sw.js css js assets www/ 2>/dev/null || true
          cp -f index.html www/index.html

          if [ ! -f "package.json" ]; then
            cat << 'EOF' > package.json
          {
            "name": "nexus-egy",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF
          fi

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nexusegy.app",
            "appName": "Nexus Egy",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add android || true
          npx cap sync android

          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK Android
        uses: actions/upload-artifact@v4
        with:
          name: NexusEgy-Android-APK
          path: "**/android/app/build/outputs/apk/debug/*.apk"

  # ==========================================
  # JOB 2: GERAR INSTALADOR WINDOWS (.EXE)
  # ==========================================
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar e Compilar Windows (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $indexFile = Get-ChildItem -Recurse -Filter "index.html" | Select-Object -First 1
          if ($indexFile) {
            Set-Location $indexFile.DirectoryName
          }

          if (!(Test-Path "package.json")) {
            $pkg = @{
              name = "nexus-egy"
              version = "1.0.0"
              description = "Nexus Egy Universal Gaming System"
              author = "Nexus Egy Team"
              main = "main.js"
              scripts = @{ "dist:win" = "electron-builder --win --x64 --publish never" }
              devDependencies = @{
                "electron" = "^30.0.0"
                "electron-builder" = "^24.13.3"
              }
              build = @{
                appId = "com.nexusegy.app"
                productName = "Nexus Egy"
                directories = @{ output = "dist" }
                win = @{ target = "nsis" }
              }
            } | ConvertTo-Json -Depth 5
            Set-Content "package.json" $pkg
          }

          if (!(Test-Path "main.js")) {
            $main = @"
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          app.whenReady().then(() => {
            const win = new BrowserWindow({ width: 1280, height: 720, autoHideMenuBar: true });
            win.maximize();
            win.loadFile(path.join(__dirname, 'index.html'));
          });
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          "@
            Set-Content "main.js" $main
          }

          npm install
          npx electron-builder --win --x64 --publish never

      - name: Salvar Instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: NexusEgy-Windows-Installer
          path: "**/dist/*.exe"
