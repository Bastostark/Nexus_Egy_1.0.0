name: Build Nexus Egy
on: [workflow_dispatch, push]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q nexus-egy.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
        working-directory: nexus-egy
      - run: npx cap add android
        working-directory: nexus-egy
      - run: npx cap sync android
        working-directory: nexus-egy
      - run: chmod +x ./gradlew && ./gradlew assembleDebug
        working-directory: nexus-egy/android
      - uses: actions/upload-artifact@v4
        with:
          name: NexusEgy-apk
          path: nexus-egy/android/app/build/outputs/apk/debug/app-debug.apk

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: Expand-Archive -Path nexus-egy.zip -DestinationPath .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: nexus-egy
      - run: npm run dist:win
        working-directory: nexus-egy
      - uses: actions/upload-artifact@v4
        with:
          name: NexusEgy-Setup-Windows
          path: nexus-egy/dist/*.exe
